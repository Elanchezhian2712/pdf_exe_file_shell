<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDF Annotator{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'annotator/css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { padding-top: 60px; }
        .annotation-controls { margin-bottom: 1rem; }
        .pdf-page-container {
            position: relative; 
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            display: inline-block; 
            background-color: #eee; 
        }
        .pdf-page-image {
            display: block; 
            max-width: 100%;
            height: auto;
            cursor: crosshair; 
        }
        .annotation-button { margin-right: 5px; font-size: 1.5rem; }
        .annotation-button.active { border: 2px solid blue; border-radius: 5px;}
        .annotation-counts span { margin-right: 15px; font-weight: bold; }

        .pdf-page-container {
            position: relative; 
            display: inline-block; 
            line-height: 0; 
        }
        
        .pdf-page-image {
            display: block; 
            max-width: 100%;
            height: auto;
        }
        
        .feedback-annotation-mark {
            position: absolute;
            width: 15px; 
            height: 15px;
            border-radius: 50%;
            pointer-events: none;
            text-align: center;
            font-size: 12px; 
            line-height: 15px; 
            z-index: 10;
            transform: translate(-50%, -50%); 
        }
            
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'upload_pdf' %}">PDF Annotator</a>
      </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
