<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shell</title>
  <style>
    body {
      background-color: #f5f5f9;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <h1>Welcome to Shell</h1>
  <button id="startBtn">Start</button>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (typeof require === 'function') {
        try {
          const { ipcRenderer } = require('electron');
          document.getElementById('startBtn').addEventListener('click', () => {
            ipcRenderer.send('open-django');
          });
        } catch (e) {
          console.warn("Electron's ipcRenderer is not available. Running in a standard browser environment?");
          document.getElementById('startBtn').addEventListener('click', () => {
            alert('Start button clicked (Non-Electron environment)');
          });
        }
      } else {
        console.warn("require is not defined. Running in a standard browser environment?");
        document.getElementById('startBtn').addEventListener('click', () => {
          alert('Start button clicked (Non-Electron environment)');
        });
      }
    });
  </script>
</body>

</html>
